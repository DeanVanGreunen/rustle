[package]
name = "rustle_core"
version = "0.1.0"
edition = "2024"
description = "Rustle project data model, save/load, and recent-projects list."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = { version = "1.0.7", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
