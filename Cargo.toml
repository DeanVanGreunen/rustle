[package]
name = "rustle"
version = "0.4.10"
edition = "2024"

[dependencies]
macroquad = "0.4.16"
rustle_ui = { path = "../rustle_ui", features = ["macroquad"] }
rustle_core = { path = "core" }
taffy = "0.13.0"
rfd = "0.15"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[build-dependencies]
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }